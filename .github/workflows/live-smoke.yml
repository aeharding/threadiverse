name: live-smoke

# Read-only smoke tests against live instances (see test/live-smoke.test.ts).
# Catches upstream API drift on a schedule instead of in consumer bug reports.

on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: npm i -fg corepack && corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run test/live-smoke.test.ts test/live-fidelity.test.ts test/live-authenticated.test.ts
        env:
          LIVE_PIEFED_ROUTES: "1"
          LIVE_SMOKE: "1"
